<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>香港跨年旅遊</title>
  <meta property="og:title" content="香港跨年旅遊" />
  <!-- Google Fonts: Huninn 與 Zen Maru Gothic 圓體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            washi: '#FFFCF6',
            ink: '#3E3A39',
            coral: '#F28B82',
            yamabuki: '#F6C85F',
            mizuiro: '#8ECAE6',
            wakatake: '#95D5B2',
          },
          fontFamily: {
            ehon: ['"Huninn"', '"Zen Maru Gothic"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* 和紙白底色與細微紙張顆粒紋理 */
    body {
      background-color: #FFFCF6;
      color: #3E3A39;
      font-family: 'Huninn', 'Zen Maru Gothic', sans-serif;
      background-image:
        radial-gradient(rgba(62, 58, 57, 0.065) 1px, transparent 0),
        radial-gradient(rgba(242, 139, 130, 0.06) 1px, transparent 0);
      background-size: 22px 22px;
      background-position: 0 0, 11px 11px;
      overflow-x: hidden;
    }

    /* 繪本風 2px 墨灰粗框與硬陰影 */
    .ehon-card {
      background-color: #FFFCF6;
      border: 2px solid #3E3A39;
      border-radius: 22px;
      box-shadow: 4px 4px 0px #3E3A39;
    }

    .ehon-card-sm {
      background-color: #FFFCF6;
      border: 2px solid #3E3A39;
      border-radius: 18px;
      box-shadow: 3px 3px 0px #3E3A39;
    }

    .ehon-btn {
      border: 2px solid #3E3A39;
      border-radius: 9999px;
      box-shadow: 2.5px 2.5px 0px #3E3A39;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
      min-height: 38px;
    }

    .ehon-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0.5px 0.5px 0px #3E3A39;
    }

    .ehon-pill {
      border: 2px solid #3E3A39;
      border-radius: 9999px;
    }

    .ehon-input {
      background-color: #FFFCF6;
      border: 2px solid #3E3A39;
      border-radius: 14px;
      padding: 8px 12px;
      width: 100%;
      font-size: 0.95rem;
      transition: background-color 0.15s ease;
    }

    .ehon-input:focus {
      outline: none;
      background-color: rgba(246, 200, 95, 0.25);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 繪本輕柔微動畫 */
    @keyframes ferryBob {
      0%, 100% { transform: rotate(-1.5deg) translateY(0px); }
      50% { transform: rotate(1.5deg) translateY(-3px); }
    }
    @keyframes fireworkTwinkle {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.22); opacity: 0.75; }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0px); }
    }

    .anim-ferry { animation: ferryBob 3.2s ease-in-out infinite; }
    .anim-sparkle { animation: fireworkTwinkle 2.4s ease-in-out infinite; transform-origin: center; }
    .anim-pop { animation: popIn 0.24s ease-out forwards; }

    /* 登機證左右缺口 */
    .ticket-notch-left, .ticket-notch-right {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #FFFCF6;
      border: 2px solid #3E3A39;
      border-radius: 9999px;
      top: 52%;
      transform: translateY(-50%);
      z-index: 10;
    }
    .ticket-notch-left { left: -12px; }
    .ticket-notch-right { right: -12px; }
  </style>
</head>
<body class="antialiased selection:bg-yamabuki selection:text-ink pb-20">

  <!-- 頂部視覺區 -->
  <header class="max-w-3xl mx-auto px-4 pt-5 pb-3">
    <div class="ehon-card p-5 sm:p-6 relative overflow-hidden">
      <!-- 頂端標籤與標題編輯 -->
      <div class="flex items-center justify-between gap-2 mb-3">
        <span class="ehon-pill bg-coral px-3 py-1 text-xs font-bold tracking-wider">HONG KONG 2026–2027</span>
        <button id="editHeroBtn" type="button"
          class="ehon-pill bg-washi hover:bg-yamabuki px-3 py-1 text-xs font-bold flex items-center gap-1 transition-colors">
          <span>✎</span>
          <span>編輯標題與日期</span>
        </button>
      </div>

      <!-- 自訂手繪 SVG 插畫：維多利亞港跨年煙火、天星小輪、雙層叮叮車與相機/行李箱 -->
      <div class="w-full bg-mizuiro/30 border-2 border-ink rounded-[18px] p-3 mb-4">
        <svg viewBox="0 0 460 175" class="w-full h-auto block" role="img" aria-label="日系繪本風香港維多利亞港煙火與天星小輪插畫">
          <!-- 跨年煙火星芒 -->
          <g class="anim-sparkle">
            <path d="M56 20 L59 29 L68 32 L59 35 L56 44 L53 35 L44 32 L53 29 Z" fill="#F6C85F" stroke="#3E3A39" stroke-width="2" stroke-linejoin="round"/>
          </g>
          <g class="anim-sparkle" style="animation-delay: 0.8s;">
            <path d="M398 18 L400.5 25 L408 27.5 L400.5 30 L398 37 L395.5 30 L388 27.5 L395.5 25 Z" fill="#F28B82" stroke="#3E3A39" stroke-width="2" stroke-linejoin="round"/>
          </g>
          <circle cx="94" cy="22" r="3" fill="#F28B82" stroke="#3E3A39" stroke-width="1.8"/>
          <circle cx="364" cy="36" r="3" fill="#F6C85F" stroke="#3E3A39" stroke-width="1.8"/>

          <!-- 雲朵 -->
          <path d="M128 34 C128 26, 140 24, 145 30 C150 23, 164 25, 166 34 C173 35, 174 44, 165 45 L130 45 C122 45, 122 35, 128 34 Z"
            fill="#FFFCF6" stroke="#3E3A39" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M294 28 C294 21, 305 19, 309 24 C314 18, 326 20, 328 28 C334 29, 335 37, 327 38 L296 38 C289 38, 289 29, 294 28 Z"
            fill="#FFFCF6" stroke="#3E3A39" stroke-width="2.2" stroke-linejoin="round"/>

          <!-- 維港天際線剪影 -->
          <rect x="36" y="74" width="32" height="50" rx="4" fill="#FFFCF6" stroke="#3E3A39" stroke-width="2.2"/>
          <rect x="74" y="50" width="36" height="74" rx="4" fill="#F6C85F" stroke="#3E3A39" stroke-width="2.2"/>
          <line x1="84" y1="60" x2="84" y2="112" stroke="#3E3A39" stroke-width="2"/>
          <line x1="92" y1="60" x2="92" y2="112" stroke="#3E3A39" stroke-width="2"/>
          <line x1="100" y1="60" x2="100" y2="112" stroke="#3E3A39" stroke-width="2"/>

          <!-- 中銀幾何塔 -->
          <line x1="224" y1="28" x2="224" y2="42" stroke="#3E3A39" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="234" y1="28" x2="234" y2="42" stroke="#3E3A39" stroke-width="2.2" stroke-linecap="round"/>
          <polygon points="212,124 212,56 229,42 246,56 246,124" fill="#8ECAE6" stroke="#3E3A39" stroke-width="2.2" stroke-linejoin="round"/>
          <line x1="212" y1="56" x2="246" y2="86" stroke="#3E3A39" stroke-width="2"/>
          <line x1="246" y1="56" x2="212" y2="86" stroke="#3E3A39" stroke-width="2"/>
          <line x1="212" y1="86" x2="246" y2="116" stroke="#3E3A39" stroke-width="2"/>
          <line x1="246" y1="86" x2="212" y2="116" stroke="#3E3A39" stroke-width="2"/>

          <!-- 會展中心波浪屋頂 -->
          <path d="M256 124 L256 96 Q282 80 308 96 Q330 85 352 98 L352 124 Z" fill="#F28B82" stroke="#3E3A39" stroke-width="2.2" stroke-linejoin="round"/>
          <rect x="358" y="72" width="28" height="52" rx="4" fill="#FFFCF6" stroke="#3E3A39" stroke-width="2.2"/>

          <!-- 維港海面 -->
          <rect x="10" y="120" width="440" height="24" fill="#8ECAE6" stroke="#3E3A39" stroke-width="2.2"/>
          <path d="M36 132 Q48 128 60 132 T84 132" fill="none" stroke="#FFFCF6" stroke-width="2" stroke-linecap="round"/>
          <path d="M366 131 Q378 127 390 131 T414 131" fill="none" stroke="#FFFCF6" stroke-width="2" stroke-linecap="round"/>

          <!-- 微笑天星小輪 -->
          <g class="anim-ferry">
            <rect x="154" y="92" width="9" height="10" rx="2" fill="#F6C85F" stroke="#3E3A39" stroke-width="2"/>
            <rect x="136" y="100" width="48" height="11" rx="3" fill="#FFFCF6" stroke="#3E3A39" stroke-width="2"/>
            <path d="M126 111 L194 111 L187 126 L133 126 Z" fill="#95D5B2" stroke="#3E3A39" stroke-width="2.2" stroke-linejoin="round"/>
            <circle cx="154" cy="118" r="1.8" fill="#3E3A39"/>
            <circle cx="166" cy="118" r="1.8" fill="#3E3A39"/>
            <path d="M157 120 Q160 123 163 120" fill="none" stroke="#3E3A39" stroke-width="1.8" stroke-linecap="round"/>
          </g>

          <!-- 岸邊道路 + 復古雙層叮叮車 + 可愛小行李箱 -->
          <rect x="10" y="144" width="440" height="23" rx="3" fill="#FFFCF6" stroke="#3E3A39" stroke-width="2.2"/>
          <!-- 小行李箱 -->
          <g>
            <rect x="74" y="124" width="22" height="24" rx="4" fill="#F28B82" stroke="#3E3A39" stroke-width="2.2"/>
            <path d="M81 124 L81 118 L89 118 L89 124" fill="none" stroke="#3E3A39" stroke-width="2.2"/>
            <line x1="81" y1="124" x2="81" y2="148" stroke="#3E3A39" stroke-width="1.8"/>
            <line x1="89" y1="124" x2="89" y2="148" stroke="#3E3A39" stroke-width="1.8"/>
            <circle cx="79" cy="150" r="2.5" fill="#3E3A39"/>
            <circle cx="91" cy="150" r="2.5" fill="#3E3A39"/>
          </g>
          <!-- 復古雙層叮叮車 -->
          <g>
            <polyline points="274,110 281,102 288,110" fill="none" stroke="#3E3A39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="256" y="110" width="52" height="36" rx="7" fill="#95D5B2" stroke="#3E3A39" stroke-width="2.2"/>
            <rect x="257.5" y="125" width="49" height="5" fill="#F6C85F"/>
            <rect x="262" y="114" width="9" height="8" rx="1.5" fill="#FFFCF6" stroke="#3E3A39" stroke-width="1.8"/>
            <rect x="275" y="114" width="9" height="8" rx="1.5" fill="#FFFCF6" stroke="#3E3A39" stroke-width="1.8"/>
            <rect x="288" y="114" width="9" height="8" rx="1.5" fill="#FFFCF6" stroke="#3E3A39" stroke-width="1.8"/>
            <rect x="262" y="133" width="9" height="8" rx="1.5" fill="#FFFCF6" stroke="#3E3A39" stroke-width="1.8"/>
            <rect x="275" y="133" width="9" height="8" rx="1.5" fill="#FFFCF6" stroke="#3E3A39" stroke-width="1.8"/>
            <rect x="288" y="133" width="9" height="8" rx="1.5" fill="#FFFCF6" stroke="#3E3A39" stroke-width="1.8"/>
            <circle cx="268" cy="148" r="3.8" fill="#3E3A39"/>
            <circle cx="296" cy="148" r="3.8" fill="#3E3A39"/>
          </g>
        </svg>
      </div>

      <!-- 標題與日期 -->
      <div class="text-center space-y-1.5 mb-4">
        <h1 id="heroTitleDisplay" class="text-2xl sm:text-3xl font-black tracking-wide">香港跨年旅遊 2026–2027</h1>
        <div class="inline-flex items-center gap-2 bg-washi border-2 border-ink rounded-full px-3.5 py-1 text-xs sm:text-sm font-bold">
          <span>📅</span>
          <span id="tripDateRangeDisplay">2026/12/31 (四) – 2027/01/04 (一) ・ 5天4夜</span>
        </div>
      </div>

      <!-- 距離 2026/12/31 即時倒數計時小卡 -->
      <div class="bg-yamabuki border-2 border-ink rounded-[18px] p-3.5 sm:p-4">
        <div class="flex items-center justify-between mb-2.5">
          <span class="font-bold text-xs sm:text-sm flex items-center gap-1.5">
            <span>⏰</span>
            <span id="countdownStatusLabel">距離 2026/12/31 跨年出發還有</span>
          </span>
          <button id="quickCountdownBtn" type="button"
            class="bg-washi border-2 border-ink rounded-full px-2.5 py-0.5 text-xs font-bold hover:bg-coral transition-colors">
            ✎ 設定時間
          </button>
        </div>

        <div class="grid grid-cols-4 gap-2 text-center">
          <div class="bg-washi border-2 border-ink rounded-2xl py-2 px-1">
            <div id="cd-days" class="text-xl sm:text-2xl font-black leading-none">--</div>
            <div class="text-[11px] mt-1 font-bold">天</div>
          </div>
          <div class="bg-washi border-2 border-ink rounded-2xl py-2 px-1">
            <div id="cd-hours" class="text-xl sm:text-2xl font-black leading-none">--</div>
            <div class="text-[11px] mt-1 font-bold">小時</div>
          </div>
          <div class="bg-washi border-2 border-ink rounded-2xl py-2 px-1">
            <div id="cd-mins" class="text-xl sm:text-2xl font-black leading-none">--</div>
            <div class="text-[11px] mt-1 font-bold">分鐘</div>
          </div>
          <div class="bg-washi border-2 border-ink rounded-2xl py-2 px-1">
            <div id="cd-secs" class="text-xl sm:text-2xl font-black leading-none">--</div>
            <div class="text-[11px] mt-1 font-bold">秒</div>
          </div>
        </div>
      </div>

      <!-- 跨裝置同步工具列 -->
      <div class="mt-4 pt-3.5 border-t-2 border-dashed border-ink flex flex-wrap items-center justify-center gap-2">
        <button id="shareUrlBtn" type="button"
          class="ehon-btn bg-yamabuki hover:bg-coral px-3.5 py-1.5 text-xs sm:text-sm font-bold flex items-center gap-1.5">
          <span>🔗</span>
          <span>複製最新行程網址</span>
        </button>
        <button id="exportJsonBtn" type="button"
          class="ehon-btn bg-mizuiro hover:bg-wakatake px-3.5 py-1.5 text-xs sm:text-sm font-bold flex items-center gap-1.5">
          <span>💾</span>
          <span>匯出備份</span>
        </button>
        <button id="importJsonBtn" type="button"
          class="ehon-btn bg-washi hover:bg-wakatake px-3.5 py-1.5 text-xs sm:text-sm font-bold flex items-center gap-1.5">
          <span>📂</span>
          <span>匯入還原</span>
        </button>
        <input id="importJsonInput" type="file" accept=".json,application/json" class="hidden" />
      </div>
    </div>
  </header>

  <!-- 黏性分頁導覽（4 個主要分頁） -->
  <nav aria-label="主要分頁切換" class="sticky top-0 z-40 bg-washi/95 backdrop-blur-sm border-y-2 border-ink py-2.5 px-4 mb-5">
    <div class="max-w-3xl mx-auto grid grid-cols-4 gap-2">
      <button type="button" data-tab="flights" class="main-tab-btn ehon-btn bg-washi py-1.5 px-2 text-xs sm:text-sm font-bold flex items-center justify-center gap-1">
        <span>✈️</span>
        <span>航班資訊</span>
      </button>
      <button type="button" data-tab="itinerary" class="main-tab-btn ehon-btn bg-yamabuki py-1.5 px-2 text-xs sm:text-sm font-bold flex items-center justify-center gap-1">
        <span>🗓️</span>
        <span>每日行程</span>
      </button>
      <button type="button" data-tab="hotels" class="main-tab-btn ehon-btn bg-washi py-1.5 px-2 text-xs sm:text-sm font-bold flex items-center justify-center gap-1">
        <span>🏨</span>
        <span>住宿資訊</span>
      </button>
      <button type="button" data-tab="checklists" class="main-tab-btn ehon-btn bg-washi py-1.5 px-2 text-xs sm:text-sm font-bold flex items-center justify-center gap-1">
        <span>🧳</span>
        <span>行前清單</span>
      </button>
    </div>
  </nav>

  <!-- 主內容區塊 -->
  <main class="max-w-3xl mx-auto px-4">

    <!-- ========================================== -->
    <!-- 分頁 1：航班資訊（支援自由新增/編輯/刪除多筆航班） -->
    <!-- ========================================== -->
    <section id="panel-flights" class="tab-panel hidden space-y-4 anim-pop">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="w-8 h-8 rounded-full bg-mizuiro border-2 border-ink flex items-center justify-center font-bold">✈</span>
          <h2 class="text-xl font-black">航班資訊</h2>
        </div>
        <button id="addFlightBtn" type="button"
          class="ehon-btn bg-mizuiro hover:bg-yamabuki px-4 py-1.5 text-xs sm:text-sm font-bold flex items-center gap-1">
          <span>＋</span>
          <span>新增航班</span>
        </button>
      </div>

      <div id="flightsList" class="space-y-4"></div>
    </section>

    <!-- ========================================== -->
    <!-- 分頁 2：每日行程（支援自由增減天數 + 節點上下移動/編輯） -->
    <!-- ========================================== -->
    <section id="panel-itinerary" class="tab-panel space-y-4 anim-pop">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="w-8 h-8 rounded-full bg-coral border-2 border-ink flex items-center justify-center font-bold">🗺</span>
          <h2 class="text-xl font-black">每日行程</h2>
        </div>
        <div class="flex items-center gap-2">
          <button id="addDayBtn" type="button"
            class="ehon-btn bg-washi hover:bg-wakatake px-3 py-1.5 text-xs font-bold flex items-center gap-1">
            <span>＋</span>
            <span>新增天數</span>
          </button>
          <button id="addEventBtn" type="button"
            class="ehon-btn bg-coral hover:bg-yamabuki px-3.5 py-1.5 text-xs sm:text-sm font-bold flex items-center gap-1">
            <span>＋</span>
            <span>新增行程</span>
          </button>
        </div>
      </div>

      <!-- 天數切換標籤列 -->
      <div id="dayTabsBar" role="tablist" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1"></div>

      <!-- 當日主題標題橫幅 -->
      <div id="dayThemeBanner" class="ehon-card-sm bg-yamabuki p-3.5 sm:p-4 flex items-center justify-between gap-3">
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-2">
            <span id="currentDayLabel" class="text-xs font-black bg-washi border-2 border-ink rounded-full px-2.5 py-0.5">Day 1 ・ 12/31 跨年夜</span>
            <button id="editDayMetaBtn" type="button"
              class="bg-washi hover:bg-coral border-2 border-ink rounded-full px-2.5 py-0.5 text-xs font-bold transition-colors">
              ✎ 編輯這天
            </button>
            <button id="deleteDayBtn" type="button"
              class="bg-washi hover:bg-coral border-2 border-ink rounded-full px-2.5 py-0.5 text-xs font-bold transition-colors">
              🗑 刪除此天
            </button>
          </div>
          <h3 id="currentDayTheme" class="text-base sm:text-lg font-black mt-1.5 truncate">維港跨年倒數與尖沙咀散步</h3>
        </div>
        <!-- 相機小插圖 -->
        <div class="shrink-0 w-12 h-12 bg-washi border-2 border-ink rounded-2xl flex items-center justify-center">
          <svg viewBox="0 0 40 40" class="w-8 h-8" role="img" aria-label="相機插畫">
            <rect x="6" y="13" width="28" height="19" rx="4" fill="#F28B82" stroke="#3E3A39" stroke-width="2.2"/>
            <path d="M14 13 L16 9 L24 9 L26 13" fill="#F6C85F" stroke="#3E3A39" stroke-width="2.2" stroke-linejoin="round"/>
            <circle cx="20" cy="22.5" r="5.5" fill="#FFFCF6" stroke="#3E3A39" stroke-width="2.2"/>
            <circle cx="20" cy="22.5" r="2.2" fill="#8ECAE6"/>
            <circle cx="29" cy="17" r="1.5" fill="#3E3A39"/>
          </svg>
        </div>
      </div>

      <!-- 垂直時間軸容器 -->
      <div id="timelineWrapper" class="relative pl-6 sm:pl-7 space-y-3.5 pt-1">
        <div id="timelineAxis" class="absolute left-[11px] sm:left-[13px] top-3 bottom-3 w-[2.5px] bg-ink rounded-full" aria-hidden="true"></div>
        <div id="timelineItems" class="space-y-3.5"></div>
      </div>
    </section>

    <!-- ========================================== -->
    <!-- 分頁 3：住宿資訊（支援多間住宿點自由新增/編輯/刪除） -->
    <!-- ========================================== -->
    <section id="panel-hotels" class="tab-panel hidden space-y-4 anim-pop">
      <div class="flex items-center justify-between gap-2">

    // ==========================================
    // 2. 純 JS LZW + Base64URL 壓縮編解碼（支援 UTF-8 繁體中文）
    // ==========================================
    function lzwCompressToBase64Url(uncompressedStr) {
      const utf8Bytes = new TextEncoder().encode(uncompressedStr);
      const dict = new Map();
      for (let i = 0; i < 256; i++) {
        dict.set(String.fromCharCode(i), i);
      }
      let w = "";
      const codes = [];
      let dictSize = 256;

      for (let i = 0; i < utf8Bytes.length; i++) {
        const c = String.fromCharCode(utf8Bytes[i]);
        const wc = w + c;
        if (dict.has(wc)) {
          w = wc;
        } else {
          codes.push(dict.get(w));
          if (dictSize < 65535) {
            dict.set(wc, dictSize++);
          }
          w = c;
        }
      }
      if (w !== "") codes.push(dict.get(w));

      const uint16Arr = new Uint16Array(codes);
      const byteArr = new Uint8Array(uint16Arr.buffer);
      let binary = "";
      const chunkSize = 0x8000;
      for (let i = 0; i < byteArr.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, byteArr.subarray(i, i + chunkSize));
      }
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function lzwDecompressFromBase64Url(base64UrlStr) {
      let b64 = base64UrlStr.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4 !== 0) b64 += "=";

      const binary = atob(b64);
      const byteArr = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        byteArr[i] = binary.charCodeAt(i);
      }
      const codes = new Uint16Array(byteArr.buffer);
      if (codes.length === 0) return "";

      const dict = new Map();
      for (let i = 0; i < 256; i++) {
        dict.set(i, String.fromCharCode(i));
      }
      let dictSize = 256;
      let w = String.fromCharCode(codes[0]);
      let result = w;

      for (let i = 1; i < codes.length; i++) {
        const k = codes[i];
        let entry = "";
        if (dict.has(k)) {
          entry = dict.get(k);
        } else if (k === dictSize) {
          entry = w + w.charAt(0);
        } else {
          throw new Error("Invalid LZW code");
        }
        result += entry;
        if (dictSize < 65535) {
          dict.set(dictSize++, w + entry.charAt(0));
        }
        w = entry;
      }

      const outBytes = new Uint8Array(result.length);
      for (let i = 0; i < result.length; i++) {
        outBytes[i] = result.charCodeAt(i);
      }
      return new TextDecoder().decode(outBytes);
    }

    function isValidTripData(obj) {
      return Boolean(
        obj &&
        typeof obj === "object" &&
        obj.hero &&
        Array.isArray(obj.flights) &&
        Array.isArray(obj.days) &&
        Array.isArray(obj.hotels) &&
        Array.isArray(obj.checklistCategories)
      );
    }

    let syncedFromHash = false;

    function loadState() {
      // 1. 偵測網址列 #trip= 分享參數
      try {
        const hash = window.location.hash || "";
        if (hash.startsWith("#trip=") && hash.length > 6) {
          const decodedJson = lzwDecompressFromBase64Url(hash.slice(6));
          const parsed = JSON.parse(decodedJson);
          if (isValidTripData(parsed)) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
            if (window.history && window.history.replaceState) {
              window.history.replaceState(null, "", window.location.pathname + window.location.search);
            }
            syncedFromHash = true;
            return parsed;
          }
        }
      } catch (err) {
        console.warn("分享網址解析失敗", err);
      }

      // 2. 讀取 localStorage
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (isValidTripData(parsed)) return parsed;
        }
      } catch (err) {
        console.warn("讀取 localStorage 失敗", err);
      }

      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    let state = loadState();
    let activeMainTab = "itinerary";
    let activeDayIndex = 0;

    function saveState(msg = "已自動儲存") {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if (msg) showToast(msg);
      } catch (e) {
        console.warn("儲存失敗", e);
      }
    }

    // ==========================================
    // 3. 工具函式：Toast 提示、Modal、Clipboard
    // ==========================================
    let toastTimeout = null;
    function showToast(text) {
      const box = document.getElementById("toastBox");
      document.getElementById("toastText").textContent = text;
      box.classList.remove("opacity-0");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => box.classList.add("opacity-0"), 2200);
    }

    function escapeHtml(val) {
      if (val === null || val === undefined) return "";
      return String(val)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const modalOverlay = document.getElementById("ehonModal");
    const modalTitleEl = document.getElementById("ehonModalTitle");
    const modalBodyEl = document.getElementById("ehonModalBody");

    function openModal(title, htmlContent) {
      modalTitleEl.textContent = title;
      modalBodyEl.innerHTML = htmlContent;
      modalOverlay.classList.remove("hidden");
      modalOverlay.classList.add("flex");
    }

    function closeModal() {
      modalOverlay.classList.add("hidden");
      modalOverlay.classList.remove("flex");
      modalBodyEl.innerHTML = "";
    }

    document.getElementById("ehonModalClose").addEventListener("click", closeModal);
    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    function copyToClipboard(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch (e) {
        ok = false;
      }
      document.body.removeChild(ta);
      return ok;
    }

    // ==========================================
    // 4. 頂部標題、倒數計時 & 跨裝置分享匯出入
    // ==========================================
    function renderHero() {
      document.getElementById("heroTitleDisplay").textContent = state.hero.title;
      document.getElementById("tripDateRangeDisplay").textContent = state.hero.dateRangeText;
      updateCountdown();
    }

    function updateCountdown() {
      const target = new Date(state.hero.departureISO).getTime();
      const diff = target - Date.now();
      const dEl = document.getElementById("cd-days");
      const hEl = document.getElementById("cd-hours");
      const mEl = document.getElementById("cd-mins");
      const sEl = document.getElementById("cd-secs");
      const labelEl = document.getElementById("countdownStatusLabel");

      if (isNaN(target) || diff <= 0) {
        labelEl.textContent = "香港跨年旅程進行中 / 已出發！";
        dEl.textContent = "00";
        hEl.textContent = "00";
        mEl.textContent = "00";
        sEl.textContent = "00";
        return;
      }

      labelEl.textContent = "距離 2026/12/31 跨年出發還有";
      dEl.textContent = String(Math.floor(diff / 86400000)).padStart(2, "0");
      hEl.textContent = String(Math.floor((diff / 3600000) % 24)).padStart(2, "0");
      mEl.textContent = String(Math.floor((diff / 60000) % 60)).padStart(2, "0");
      sEl.textContent = String(Math.floor((diff / 1000) % 60)).padStart(2, "0");
    }

    function openHeroModal() {
      const h = state.hero;
      openModal("編輯標題與倒數時間", `
        <form id="heroForm" class="space-y-3 text-sm">
          <div>
            <label class="block font-bold mb-1">標題名稱</label>
            <input type="text" name="title" value="${escapeHtml(h.title)}" class="ehon-input" required />
          </div>
          <div>
            <label class="block font-bold mb-1">日期區間顯示文字</label>
            <input type="text" name="dateRangeText" value="${escapeHtml(h.dateRangeText)}" class="ehon-input" required />
          </div>
          <div>
            <label class="block font-bold mb-1">倒數計時目標時間</label>
            <input type="datetime-local" name="departureISO" value="${escapeHtml(h.departureISO)}" class="ehon-input" required />
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="ehon-btn bg-washi px-4 py-1.5 font-bold">取消</button>
            <button type="submit" class="ehon-btn bg-yamabuki px-5 py-1.5 font-bold">儲存</button>
          </div>
        </form>
      `);
      document.getElementById("heroForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        state.hero.title = fd.get("title").trim();
        state.hero.dateRangeText = fd.get("dateRangeText").trim();
        state.hero.departureISO = fd.get("departureISO");
        saveState("已更新標題與時間");
        renderHero();
        closeModal();
      });
    }

    function handleShareUrl() {
      try {
        const compressed = lzwCompressToBase64Url(JSON.stringify(state));
        const shareUrl = `${window.location.origin}${window.location.pathname}#trip=${compressed}`;
        const copied = copyToClipboard(shareUrl);
        if (copied) showToast("已複製最新行程網址！傳給旅伴點開即可同步 ✨");

        openModal("🔗 最新行程分享網址", `
          <div class="space-y-3 text-sm">
            <textarea id="shareUrlBox" rows="3" readonly class="ehon-input text-xs break-all bg-yamabuki/20">${escapeHtml(shareUrl)}</textarea>
            <div class="flex justify-end gap-2">
              <button type="button" onclick="closeModal()" class="ehon-btn bg-washi px-4 py-1.5 font-bold">關閉</button>
              <button type="button" id="copyShareAgainBtn" class="ehon-btn bg-yamabuki px-4 py-1.5 font-bold">📋 複製網址</button>
            </div>
          </div>
        `);
        const box = document.getElementById("shareUrlBox");
        box.select();
        document.getElementById("copyShareAgainBtn").addEventListener("click", () => {
          box.select();
          copyToClipboard(shareUrl);
          showToast("已複製最新行程網址 ✨");
        });
      } catch (e) {
        showToast("產生分享網址失敗");
      }
    }

    function handleExportJson() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `hk_trip_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("已匯出備份檔 💾");
    }

    function handleImportJson(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!isValidTripData(parsed)) {
            showToast("檔案格式不正確");
            return;
          }
          state = parsed;
          activeDayIndex = 0;
          saveState("已成功匯入還原行程 🎉");
          renderAll();
        } catch (err) {
          showToast("讀取 JSON 檔案失敗");
        }
      };
      reader.readAsText(file, "UTF-8");
    }

    // ==========================================
    // 5. 主要 4 分頁切換控制
    // ==========================================
    function switchMainTab(tabName) {
      activeMainTab = tabName;
      document.querySelectorAll(".tab-panel").forEach((el) => el.classList.add("hidden"));
      const targetPanel = document.getElementById(`panel-${tabName}`);
      if (targetPanel) targetPanel.classList.remove("hidden");

      document.querySelectorAll(".main-tab-btn").forEach((btn) => {
        const isCurrent = btn.getAttribute("data-tab") === tabName;
        btn.classList.toggle("bg-yamabuki", isCurrent);
        btn.classList.toggle("bg-washi", !isCurrent);
      });
    }

    // ==========================================
    // 6. 分頁 1：航班資訊（自由增刪改多張航班）
    // ==========================================
    function renderFlights() {
      const container = document.getElementById("flightsList");
      container.innerHTML = "";

      if (state.flights.length === 0) {
        container.innerHTML = `
          <div class="ehon-card p-6 text-center space-y-3">

          </div>

            <span class="text-ink/80">${escapeHtml(f.note)}</span>
          </div>

        container.appendChild(card);
      });

      document.querySelectorAll(".edit-flight-btn").forEach((btn) => {
        btn.addEventListener("click", () => openFlightModal(Number(btn.getAttribute("data-idx"))));
      });
      document.querySelectorAll(".del-flight-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.flights.splice(Number(btn.getAttribute("data-idx")), 1);
          saveState("已刪除航班");
          renderFlights();
        });
      });
    }

    // ==========================================
    // 7. 分頁 2：每日行程（天數自由增減 + 節點上下移動/編輯）
    // ==========================================
    function renderDayTabs() {
      const bar = document.getElementById("dayTabsBar");
      bar.innerHTML = "";

      if (activeDayIndex >= state.days.length) {
        activeDayIndex = Math.max(0, state.days.length - 1);
      }

      state.days.forEach((d, idx) => {
        const isSelected = idx === activeDayIndex;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", isSelected ? "true" : "false");
        btn.className = `ehon-btn shrink-0 px-3.5 py-1.5 text-xs sm:text-sm font-bold flex items-center gap-1.5 ${
          isSelected ? "bg-coral" : "bg-washi hover:bg-yamabuki/40"
        }`;
        btn.innerHTML = `
          <span>${escapeHtml(d.tabTitle)}</span>
          <span class="text-[11px] opacity-85">${escapeHtml(d.dateText.split(" ")[0])}</span>
        `;
        btn.addEventListener("click", () => {
          activeDayIndex = idx;
          renderDayTabs();
          renderDayContent();
        });
        bar.appendChild(btn);
      });
    }

    function renderDayContent() {
      const day = state.days[activeDayIndex];
      const banner = document.getElementById("dayThemeBanner");
      const itemsContainer = document.getElementById("timelineItems");
      const axis = document.getElementById("timelineAxis");
      const wrapper = document.getElementById("timelineWrapper");

      if (!day) {
        banner.classList.add("hidden");
        axis.classList.add("hidden");
        itemsContainer.innerHTML = `
          <div class="ehon-card p-6 text-center">
            <p class="font-bold text-sm">目前沒有天數，請點擊上方「＋ 新增天數」建立第一天行程！</p>
          </div>
        `;
        return;
      }

      banner.classList.remove("hidden");
      document.getElementById("currentDayLabel").textContent = `${day.tabTitle} ・ ${day.dateText}`;
      document.getElementById("currentDayTheme").textContent = day.theme || "未設定當日主題";

      itemsContainer.innerHTML = "";

      if (!day.events || day.events.length === 0) {
        axis.classList.add("hidden");
        wrapper.classList.remove("pl-6", "sm:pl-7");
        itemsContainer.innerHTML = `
          <div class="ehon-card p-6 text-center space-y-3">
            <p class="font-bold text-sm">這天目前還沒有安排行程節點</p>
            <button type="button" id="emptyDayAddBtn" class="ehon-btn bg-yamabuki hover:bg-coral px-4 py-2 text-xs sm:text-sm font-bold">
              ＋ 新增第一個行程
            </button>
          </div>
        `;
        document.getElementById("emptyDayAddBtn").addEventListener("click", () => openEventModal(null));
        return;
      }

      axis.classList.remove("hidden");
      wrapper.classList.add("pl-6", "sm:pl-7");

      day.events.forEach((ev, idx) => {
        const tagBg = CATEGORY_TAG_COLORS[ev.category] || "bg-washi";
        const mapHref = ev.mapUrl && ev.mapUrl.trim()
          ? ev.mapUrl.trim()
          : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("香港 " + ev.place)}`;

        const node = document.createElement("div");
        node.className = "relative";
        node.innerHTML = `
          <span class="absolute -left-[21px] sm:-left-[23px] top-5 w-3.5 h-3.5 rounded-full ${tagBg} border-2 border-ink z-10" aria-hidden="true"></span>

          <article class="ehon-card-sm p-3.5 sm:p-4 space-y-2">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="bg-ink text-washi rounded-xl px-2.5 py-0.5 text-xs font-bold">${escapeHtml(ev.time)}</span>
                <span class="${tagBg} border-2 border-ink rounded-full px-2.5 py-0.5 text-xs font-bold">${escapeHtml(ev.category)}</span>
              </div>

              <!-- 上下移動、編輯與刪除控制 -->
              <div class="flex items-center gap-1">
                <button type="button" data-idx="${idx}" title="上移" ${idx === 0 ? "disabled" : ""}
                  class="move-up-btn bg-washi hover:bg-yamabuki disabled:opacity-35 border-2 border-ink rounded-full w-7 h-7 text-xs font-bold flex items-center justify-center">↑</button>
                <button type="button" data-idx="${idx}" title="下移" ${idx === day.events.length - 1 ? "disabled" : ""}
                  class="move-down-btn bg-washi hover:bg-yamabuki disabled:opacity-35 border-2 border-ink rounded-full w-7 h-7 text-xs font-bold flex items-center justify-center">↓</button>
                <button type="button" data-idx="${idx}" title="編輯"
                  class="edit-ev-btn bg-washi hover:bg-mizuiro border-2 border-ink rounded-full px-2.5 h-7 text-xs font-bold">✎</button>
                <button type="button" data-idx="${idx}" title="刪除"
                  class="del-ev-btn bg-washi hover:bg-coral border-2 border-ink rounded-full w-7 h-7 text-xs font-bold flex items-center justify-center">✕</button>
              </div>
            </div>

            <h4 class="text-base sm:text-lg font-black">${escapeHtml(ev.place)}</h4>

            ${ev.note ? `<p class="text-xs sm:text-sm text-ink/85 leading-relaxed">${escapeHtml(ev.note)}</p>` : ""}

            <div class="pt-1 flex justify-end">
              <a href="${escapeHtml(mapHref)}" target="_blank" rel="noopener noreferrer"
                class="inline-flex items-center gap-1 bg-washi hover:bg-mizuiro/60 border-2 border-ink rounded-full px-3 py-1 text-xs font-bold transition-colors">
                <span>📍</span>
                <span>地圖導航</span>
              </a>
            </div>
          </article>
        `;
        itemsContainer.appendChild(node);
      });

      document.querySelectorAll(".move-up-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = Number(btn.getAttribute("data-idx"));
          if (i > 0) {
            [day.events[i - 1], day.events[i]] = [day.events[i], day.events[i - 1]];
            saveState("已調整行程順序");
            renderDayContent();
          }
        });
      });

      document.querySelectorAll(".move-down-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = Number(btn.getAttribute("data-idx"));
          if (i < day.events.length - 1) {
            [day.events[i], day.events[i + 1]] = [day.events[i + 1], day.events[i]];
            saveState("已調整行程順序");
            renderDayContent();
          }
        });
      });

      document.querySelectorAll(".edit-ev-btn").forEach((btn) => {
        btn.addEventListener("click", () => openEventModal(Number(btn.getAttribute("data-idx"))));
      });

      document.querySelectorAll(".del-ev-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          day.events.splice(Number(btn.getAttribute("data-idx")), 1);
          saveState("已刪除行程");
          renderDayContent();
        });
      });
    }

    function openDayMetaModal(isNew = false) {
      const day = isNew
        ? { tabTitle: `Day ${state.days.length + 1}`, dateText: "01/05 (二)", theme: "" }
        : state.days[activeDayIndex];

      openModal(isNew ? "新增行程天數" : "編輯當日標題與日期", `
        <form id="dayMetaForm" class="space-y-3 text-sm">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold mb-1">分頁標籤（如 Day 1）</label>
              <input type="text" name="tabTitle" value="${escapeHtml(day.tabTitle)}" class="ehon-input" required />
            </div>
            <div>
              <label class="block font-bold mb-1">日期說明</label>
              <input type="text" name="dateText" value="${escapeHtml(day.dateText)}" placeholder="12/31 (四) 跨年夜" class="ehon-input" required />
            </div>
          </div>
          <div>
            <label class="block font-bold mb-1">當日主題標題</label>
            <input type="text" name="theme" value="${escapeHtml(day.theme)}" placeholder="例如：維港跨年煙火與海濱散步" class="ehon-input" />
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="ehon-btn bg-washi px-4 py-1.5 font-bold">取消</button>
            <button type="submit" class="ehon-btn bg-yamabuki px-5 py-1.5 font-bold">儲存</button>
          </div>
        </form>
      `);

      document.getElementById("dayMetaForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        if (isNew) {
          state.days.push({
            id: `day-${Date.now()}`,
            tabTitle: fd.get("tabTitle").trim(),
            dateText: fd.get("dateText").trim(),
            theme: fd.get("theme").trim(),
            events: []
          });
          activeDayIndex = state.days.length - 1;
          saveState("已新增天數");
        } else {
          day.tabTitle = fd.get("tabTitle").trim();
          day.dateText = fd.get("dateText").trim();
          day.theme = fd.get("theme").trim();
          saveState("已更新當日資訊");
        }
        renderDayTabs();
        renderDayContent();
        closeModal();
      });
    }

    function openEventModal(editIdx = null) {
      const day = state.days[activeDayIndex];
      if (!day) {
        openDayMetaModal(true);
        return;
      }
      const isEdit = editIdx !== null && day.events[editIdx];
      const ev = isEdit
        ? day.events[editIdx]
        : { time: "12:00", place: "", category: "景點", mapUrl: "", note: "" };

      const catOpts = Object.keys(CATEGORY_TAG_COLORS)
        .map((c) => `<option value="${c}" ${ev.category === c ? "selected" : ""}>${c}</option>`)
        .join("");

      openModal(isEdit ? "編輯行程節點" : `新增 ${day.tabTitle} 行程`, `
        <form id="eventNodeForm" class="space-y-3 text-sm">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold mb-1">時間</label>
              <input type="time" name="time" value="${escapeHtml(ev.time)}" class="ehon-input" required />
            </div>
            <div>
              <label class="block font-bold mb-1">分類標籤</label>
              <select name="category" class="ehon-input">${catOpts}</select>
            </div>
          </div>
          <div>
            <label class="block font-bold mb-1">地點名稱</label>
            <input type="text" name="place" value="${escapeHtml(ev.place)}" placeholder="例如：星光大道 / 蘭芳園" class="ehon-input" required />
          </div>
          <div>
            <label class="block font-bold mb-1">自訂地圖連結（選填，留空則自動搜尋地點）</label>
            <input type="url" name="mapUrl" value="${escapeHtml(ev.mapUrl)}" placeholder="https://maps.google.com/..." class="ehon-input" />
          </div>
          <div>
            <label class="block font-bold mb-1">備註（選填）</label>
            <textarea name="note" rows="2" placeholder="必吃美食、交通方式或預約提醒..." class="ehon-input">${escapeHtml(ev.note)}</textarea>
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="ehon-btn bg-washi px-4 py-1.5 font-bold">取消</button>
            <button type="submit" class="ehon-btn bg-coral px-5 py-1.5 font-bold">${isEdit ? "儲存修改" : "加入行程"}</button>
          </div>
        </form>
      `);

      document.getElementById("eventNodeForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const item = {
          id: isEdit ? ev.id : `ev-${Date.now()}`,
          time: fd.get("time"),
          category: fd.get("category"),
          place: fd.get("place").trim(),
          mapUrl: fd.get("mapUrl").trim(),
          note: fd.get("note").trim()
        };
        if (isEdit) day.events[editIdx] = item;
        else day.events.push(item);

        saveState(isEdit ? "已更新行程" : "已新增行程");
        renderDayContent();
        closeModal();
      });
    }

              <span class="break-all">${escapeHtml(h.address)}</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="font-bold shrink-0">🔖 訂房編號：</span>
              <span class="bg-yamabuki/70 border border-ink rounded px-2 py-0.5 font-bold text-xs">${escapeHtml(h.bookingRef || "未填寫")}</span>
            </div>
            ${h.note ? `<div class="flex items-start gap-1.5"><span class="font-bold shrink-0">💡 備註：</span><span>${escapeHtml(h.note)}</span></div>` : ""}
          </div>

          <div class="flex flex-wrap gap-2">
            <button type="button" data-addr="${escapeHtml(h.address)}"
              class="copy-hotel-addr-btn ehon-btn bg-mizuiro hover:bg-yamabuki px-3.5 py-1.5 text-xs font-bold flex items-center gap-1">
              <span>📋</span>
              <span>複製地址</span>
            </button>
            <a href="${mapLink}" target="_blank" rel="noopener noreferrer"
              class="ehon-btn bg-yamabuki hover:bg-coral px-3.5 py-1.5 text-xs font-bold flex items-center gap-1">
              <span>🧭</span>
              <span>Google Maps 導航</span>
            </a>
          </div>
        `;
        container.appendChild(card);
      });

      document.querySelectorAll(".edit-hotel-btn").forEach((btn) => {
        btn.addEventListener("click", () => openHotelModal(Number(btn.getAttribute("data-idx"))));
      });
      document.querySelectorAll(".del-hotel-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.hotels.splice(Number(btn.getAttribute("data-idx")), 1);
          saveState("已刪除住宿資訊");
          renderHotels();
        });
      });
      document.querySelectorAll(".copy-hotel-addr-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          copyToClipboard(btn.getAttribute("data-addr") || "");
          showToast("已複製飯店地址 📋");
        });
      });
    }

    function openHotelModal(editIdx = null) {
      const isEdit = editIdx !== null && state.hotels[editIdx];
      const h = isEdit
        ? state.hotels[editIdx]
        : {
            dateRange: "2027/01/02 – 2027/01/04 (2晚)",
            name: "",
            roomType: "",
            address: "",
            bookingRef: "",
            note: ""
          };

      openModal(isEdit ? "編輯住宿資訊" : "新增住宿資訊", `
        <form id="hotelForm" class="space-y-3 text-sm">
          <div>
            <label class="block font-bold mb-1">入住與退房日期區間</label>
            <input type="text" name="dateRange" value="${escapeHtml(h.dateRange)}" placeholder="例如：2026/12/31 – 2027/01/02 (2晚)" class="ehon-input" required />
          </div>
          <div>
            <label class="block font-bold mb-1">飯店 / 旅宿名稱</label>
            <input type="text" name="name" value="${escapeHtml(h.name)}" placeholder="例如：銅鑼灣迷你酒店" class="ehon-input" required />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold mb-1">房型</label>
              <input type="text" name="roomType" value="${escapeHtml(h.roomType)}" placeholder="雙人房" class="ehon-input" />
            </div>
            <div>
              <label class="block font-bold mb-1">訂房編號</label>
              <input type="text" name="bookingRef" value="${escapeHtml(h.bookingRef)}" placeholder="選填" class="ehon-input" />
            </div>
          </div>
          <div>
            <label class="block font-bold mb-1">飯店地址（用於 Google Maps 導航）</label>
            <input type="text" name="address" value="${escapeHtml(h.address)}" placeholder="香港銅鑼灣新會道 8 號" class="ehon-input" required />
          </div>
          <div>
            <label class="block font-bold mb-1">入住備註</label>
            <textarea name="note" rows="2" placeholder="15:00 入住、近地鐵站出口..." class="ehon-input">${escapeHtml(h.note)}</textarea>
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="ehon-btn bg-washi px-4 py-1.5 font-bold">取消</button>
            <button type="submit" class="ehon-btn bg-wakatake px-5 py-1.5 font-bold">儲存住宿</button>
          </div>
        </form>
      `);

      document.getElementById("hotelForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const item = {
          id: isEdit ? h.id : `ht-${Date.now()}`,
          dateRange: fd.get("dateRange").trim(),
          name: fd.get("name").trim(),
          roomType: fd.get("roomType").trim(),
          bookingRef: fd.get("bookingRef").trim(),
          address: fd.get("address").trim(),
          note: fd.get("note").trim()
        };
        if (isEdit) state.hotels[editIdx] = item;
        else state.hotels.push(item);

        saveState(isEdit ? "已更新住宿資訊" : "已新增住宿資訊");
        renderHotels();
        closeModal();
      });
    }

    // ==========================================
    // 9. 分頁 4：行前清單（自訂分類 + 分類內直接新增項目）
    // ==========================================
    function renderChecklists() {
      const grid = document.getElementById("checklistCategoriesGrid");
      grid.innerHTML = "";

      let totalCount = 0;
      let doneCount = 0;

      state.checklistCategories.forEach((cat, catIdx) => {
        const catItems = cat.items || [];
        const catDone = catItems.filter((i) => i.done).length;
        totalCount += catItems.length;
        doneCount += catDone;

        const card = document.createElement("article");
        card.className = "ehon-card p-4 flex flex-col justify-between space-y-3";

        const itemsHtml = catItems
          .map(
            (item, itemIdx) => `
            <li class="flex items-center justify-between gap-2 p-2 rounded-xl border-2 border-ink transition-colors ${
              item.done ? "bg-wakatake/30" : "bg-washi"
            }">
              <div class="flex items-center gap-2.5 flex-1 min-w-0">
                <button type="button" data-cat="${catIdx}" data-item="${itemIdx}" aria-label="勾選項目"
                  class="toggle-check-btn w-6 h-6 rounded-lg border-2 border-ink flex items-center justify-center shrink-0 ${
                    item.done ? "bg-wakatake" : "bg-washi"
                  }">
                  ${
                    item.done
                      ? '<svg viewBox="0 0 20 20" class="w-4 h-4"><polyline points="4,10 8,14 16,6" fill="none" stroke="#3E3A39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
                      : ""
                  }
                </button>
                <span data-cat="${catIdx}" data-item="${itemIdx}" title="點擊修改文字"
                  class="edit-check-text-btn cursor-pointer text-xs sm:text-sm leading-snug break-words flex-1 ${
                    item.done ? "line-through opacity-60" : "font-bold"
                  }">${escapeHtml(item.text)}</span>
              </div>
              <button type="button" data-cat="${catIdx}" data-item="${itemIdx}" aria-label="刪除項目"
                class="del-check-item-btn text-xs font-bold text-ink/55 hover:text-ink px-1.5 py-0.5">✕</button>
            </li>
          `
          )
          .join("");

        card.innerHTML = `
          <div class="space-y-3">
            <!-- 分類標頭（可點擊編輯標題或刪除整組分類） -->
            <div class="flex items-center justify-between gap-2 pb-2 border-b-2 border-dashed border-ink">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-3.5 h-3.5 rounded-full ${cat.color || "bg-coral"} border-2 border-ink shrink-0"></span>
                <h3 data-cat="${catIdx}" title="點擊編輯分類標題"
                  class="edit-cat-title-btn cursor-pointer text-base font-black truncate hover:underline">${escapeHtml(cat.title)}</h3>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <span class="ehon-pill ${cat.color || "bg-coral"}/50 px-2 py-0.5 text-[11px] font-bold">${catDone}/${catItems.length}</span>
                <button type="button" data-cat="${catIdx}" title="編輯分類"
                  class="edit-cat-title-btn bg-washi hover:bg-yamabuki border-2 border-ink rounded-full w-6 h-6 text-[11px] font-bold flex items-center justify-center">✎</button>
                <button type="button" data-cat="${catIdx}" title="刪除整組分類"
                  class="del-cat-btn bg-washi hover:bg-coral border-2 border-ink rounded-full w-6 h-6 text-[11px] font-bold flex items-center justify-center">✕</button>
              </div>
            </div>

            <!-- 勾選項目列表 -->
            <ul class="space-y-2">
              ${itemsHtml || '<li class="text-xs text-ink/60 text-center py-2">尚無項目，在下方輸入新增吧</li>'}
            </ul>
          </div>

          <!-- 分類卡片內部底部專屬「＋ 新增到此分類」輸入框 -->
          <form data-cat="${catIdx}" class="add-to-cat-form flex items-center gap-1.5 pt-2 border-t-2 border-dashed border-ink">
            <input type="text" placeholder="＋ 新增到此分類..." required
              class="flex-1 bg-washi border-2 border-ink rounded-xl px-3 py-1.5 text-xs sm:text-sm focus:outline-none focus:bg-yamabuki/25" />
            <button type="submit" aria-label="新增到此分類"
              class="ehon-btn ${cat.color || "bg-yamabuki"} px-3 py-1 text-sm font-black shrink-0">＋</button>
          </form>
        `;

        grid.appendChild(card);
      });

      // 更新總進度條
      const pct = totalCount === 0 ? 0 : Math.round((doneCount / totalCount) * 100);
      document.getElementById("checklistProgressText").textContent = `${doneCount} / ${totalCount} (${pct}%)`;
      document.getElementById("checklistProgressBar").style.width = `${pct}%`;

      // 綁定勾選
      document.querySelectorAll(".toggle-check-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const c = Number(btn.getAttribute("data-cat"));
          const i = Number(btn.getAttribute("data-item"));
          state.checklistCategories[c].items[i].done = !state.checklistCategories[c].items[i].done;
          saveState("");
          renderChecklists();
        });
      });

      // 綁定點擊項目文字直接修改
      document.querySelectorAll(".edit-check-text-btn").forEach((el) => {
        el.addEventListener("click", () => {
          const c = Number(el.getAttribute("data-cat"));
          const i = Number(el.getAttribute("data-item"));
          const item = state.checklistCategories[c].items[i];
          openModal("修改清單項目", `
            <form id="editItemTextForm" class="space-y-3 text-sm">
              <input type="text" name="text" value="${escapeHtml(item.text)}" class="ehon-input" required />
              <div class="flex justify-end gap-2">
                <button type="button" onclick="closeModal()" class="ehon-btn bg-washi px-4 py-1.5 font-bold">取消</button>
                <button type="submit" class="ehon-btn bg-wakatake px-5 py-1.5 font-bold">儲存</button>
              </div>
            </form>
          `);
          document.getElementById("editItemTextForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const val = new FormData(e.target).get("text").trim();
            if (val) {
              item.text = val;
              saveState("已修改項目");
              renderChecklists();
            }
            closeModal();
          });
        });
      });

      // 綁定刪除單一項目
      document.querySelectorAll(".del-check-item-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const c = Number(btn.getAttribute("data-cat"));
          const i = Number(btn.getAttribute("data-item"));
          state.checklistCategories[c].items.splice(i, 1);
          saveState("已移除項目");
          renderChecklists();
        });
      });

      // 綁定分類內直接新增項目
      document.querySelectorAll(".add-to-cat-form").forEach((form) => {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const c = Number(form.getAttribute("data-cat"));
          const input = form.querySelector("input");
          const val = input.value.trim();
          if (!val) return;
          state.checklistCategories[c].items.push({
            id: `it-${Date.now()}`,
            text: val,
            done: false
          });
          saveState("已新增項目");
          renderChecklists();
        });
      });

      // 綁定編輯分類標題
      document.querySelectorAll(".edit-cat-title-btn").forEach((btn) => {
        btn.addEventListener("click", () => openCategoryModal(Number(btn.getAttribute("data-cat"))));
      });

      // 綁定刪除整組分類
      document.querySelectorAll(".del-cat-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const c = Number(btn.getAttribute("data-cat"));
          const catName = state.checklistCategories[c].title;
          openModal("刪除清單分類", `
            <div class="space-y-4 text-sm">
              <p>確定要刪除「<strong>${escapeHtml(catName)}</strong>」整組分類與裡面的所有項目嗎？</p>
              <div class="flex justify-end gap-2">
                <button type="button" onclick="closeModal()" class="ehon-btn bg-washi px-4 py-1.5 font-bold">取消</button>
                <button type="button" id="confirmDelCatBtn" class="ehon-btn bg-coral px-5 py-1.5 font-bold">確定刪除</button>
              </div>
            </div>
          `);
          document.getElementById("confirmDelCatBtn").addEventListener("click", () => {
            state.checklistCategories.splice(c, 1);
            saveState("已刪除分類");
            renderChecklists();
            closeModal();
          });
        });
      });
    }

    function openCategoryModal(editCatIdx = null) {
      const isEdit = editCatIdx !== null && state.checklistCategories[editCatIdx];
      const cat = isEdit
        ? state.checklistCategories[editCatIdx]
        : {
            title: "",
            color: CARD_ACCENT_COLORS[state.checklistCategories.length % CARD_ACCENT_COLORS.length]
          };

      openModal(isEdit ? "編輯清單分類" : "新增清單分類", `
        <form id="catModalForm" class="space-y-3 text-sm">
          <div>
            <label class="block font-bold mb-1">分類標題名稱</label>
            <input type="text" name="title" value="${escapeHtml(cat.title)}" placeholder="例如：藥品與個人小物 / 伴手禮採買" class="ehon-input" required />
          </div>
          <div>
            <label class="block font-bold mb-1">標籤色系</label>
            <select name="color" class="ehon-input">
              <option value="bg-coral" ${cat.color === "bg-coral" ? "selected" : ""}>珊瑚粉</option>
              <option value="bg-yamabuki" ${cat.color === "bg-yamabuki" ? "selected" : ""}>山吹黃</option>
              <option value="bg-mizuiro" ${cat.color === "bg-mizuiro" ? "selected" : ""}>水色藍</option>
              <option value="bg-wakatake" ${cat.color === "bg-wakatake" ? "selected" : ""}>若竹綠</option>
            </select>
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="ehon-btn bg-washi px-4 py-1.5 font-bold">取消</button>
            <button type="submit" class="ehon-btn bg-yamabuki px-5 py-1.5 font-bold">儲存</button>
          </div>
        </form>
      `);

      document.getElementById("catModalForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const title = fd.get("title").trim();
        const color = fd.get("color");
        if (!title) return;

        if (isEdit) {
          cat.title = title;
          cat.color = color;
          saveState("已更新分類");
        } else {
          state.checklistCategories.push({
            id: `cat-${Date.now()}`,
            title,
            color,
            items: []
          });
          saveState("已新增清單分類");
        }
        renderChecklists();
        closeModal();
      });
    }

    // ==========================================
    // 10. 整體渲染與事件初始化
    // ==========================================
    function renderAll() {
      renderHero();
      renderFlights();
      renderDayTabs();
      renderDayContent();
      renderHotels();
      renderChecklists();
      switchMainTab(activeMainTab);
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderAll();
      setInterval(updateCountdown, 1000);

      // 頂部區按鈕
      document.getElementById("editHeroBtn").addEventListener("click", openHeroModal);
      document.getElementById("quickCountdownBtn").addEventListener("click", openHeroModal);
      document.getElementById("shareUrlBtn").addEventListener("click", handleShareUrl);
      document.getElementById("exportJsonBtn").addEventListener("click", handleExportJson);

      const importInput = document.getElementById("importJsonInput");
      document.getElementById("importJsonBtn").addEventListener("click", () => importInput.click());
      importInput.addEventListener("change", (e) => {
        if (e.target.files && e.target.files[0]) {
          handleImportJson(e.target.files[0]);
          e.target.value = "";
        }
      });

      // 主分頁導覽
      document.querySelectorAll(".main-tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => switchMainTab(btn.getAttribute("data-tab")));
      });

      // 各分頁新增按鈕
      document.getElementById("addFlightBtn").addEventListener("click", () => openFlightModal(null));
      document.getElementById("addDayBtn").addEventListener("click", () => openDayMetaModal(true));
      document.getElementById("editDayMetaBtn").addEventListener("click", () => openDayMetaModal(false));
      document.getElementById("addEventBtn").addEventListener("click", () => openEventModal(null));

      document.getElementById("deleteDayBtn").addEventListener("click", () => {
        if (state.days.length <= 1) {
          showToast("至少需保留一天行程");
          return;
        }
        const dayTitle = state.days[activeDayIndex].tabTitle;
        openModal("刪除行程天數", `
          <div class="space-y-4 text-sm">
            <p>確定要刪除「<strong>${escapeHtml(dayTitle)}</strong>」及其所有行程節點嗎？</p>
            <div class="flex justify-end gap-2">
              <button type="button" onclick="closeModal()" class="ehon-btn bg-washi px-4 py-1.5 font-bold">取消</button>
              <button type="button" id="confirmDelDayBtn" class="ehon-btn bg-coral px-5 py-1.5 font-bold">確定刪除</button>
            </div>
          </div>
        `);
        document.getElementById("confirmDelDayBtn").addEventListener("click", () => {
          state.days.splice(activeDayIndex, 1);
          activeDayIndex = Math.max(0, activeDayIndex - 1);
          saveState("已刪除天數");
          renderDayTabs();
          renderDayContent();
          closeModal();
        });
      });

      document.getElementById("addHotelBtn").addEventListener("click", () => openHotelModal(null));
      document.getElementById("addCategoryBtn").addEventListener("click", () => openCategoryModal(null));

      if (syncedFromHash) {
        setTimeout(() => showToast("已從分享網址同步最新行程 🎉"), 350);
      }
    });
  </script>
</body>
</html>
